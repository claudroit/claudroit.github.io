<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>claudroit</title>
  <meta name="description" content="Projects by claudroit." />
  <link rel="icon" href="gemini-chat/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..650&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090c; --surface: rgba(255,255,255,.045); --border: rgba(255,255,255,.08);
      --text: #f4f3f8; --text-2: #a9a8b6; --text-3: #6f6e7b;
      --grad: linear-gradient(120deg, #6ea8ff, #a78bfa 52%, #f472b6);
      color-scheme: dark;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f3ee; --surface: rgba(20,16,40,.04); --border: rgba(20,16,40,.08);
        --text: #17161c; --text-2: #5c5a68; --text-3: #9795a3;
        --grad: linear-gradient(120deg, #3b7bff, #8b5cf6 52%, #e8458f); color-scheme: light; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
      font: 15px/1.6 "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      display: grid; place-items: center;
      padding: calc(env(safe-area-inset-top) + 32px) 20px calc(env(safe-area-inset-bottom) + 32px);
    }
    body::before {
      content: ""; position: fixed; inset: -20vmax; z-index: -1; pointer-events: none; filter: blur(70px);
      background: radial-gradient(40vmax 32vmax at 25% 15%, rgba(80,120,255,.25), transparent),
                  radial-gradient(38vmax 38vmax at 85% 30%, rgba(160,100,255,.2), transparent);
    }
    main { width: 100%; max-width: 520px; }
    h1 { margin: 0 0 6px; font: 400 clamp(46px, 13vw, 64px)/1 "Instrument Serif", serif; letter-spacing: -.02em; }
    h1 em { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .05em; }
    p.lead { margin: 0 0 32px; color: var(--text-2); }
    .label { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
    a.card {
      display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--border); color: inherit; text-decoration: none;
      transition: transform .3s cubic-bezier(.32,.72,0,1), border-color .2s;
    }
    a.card:hover { border-color: color-mix(in srgb, var(--text) 18%, transparent); }
    a.card:active { transform: scale(.98); }
    a.card img { width: 52px; height: 52px; border-radius: 15px; flex: none; }
    a.card strong { display: block; font-weight: 600; letter-spacing: -.01em; }
    a.card span { display: block; font-size: 13.5px; color: var(--text-3); }
    a.card svg { margin-left: auto; width: 20px; height: 20px; color: var(--text-3); flex: none; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, from <em>claudroit</em>.</h1>
    <p class="lead">A small collection of things I've made.</p>
    <div class="label">Projects</div>
    <a class="card" href="gemini-chat/">
      <img src="gemini-chat/icons/icon-192.png" alt="" />
      <div>
        <strong>Lumen</strong>
        <span>A mobile-first Gemini chat app. Bring your own API key.</span>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16 16 8M9 8h7v7" /></svg>
    </a>
    <a class="card" href="waymark/">
      <img src="waymark/icons/icon-192.png" alt="" />
      <div>
        <strong>Waymark</strong>
        <span>Waymark</span>
      </div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16 16 8M9 8h7v7" /></svg>
    </a>
  </main>
</body>
</html>
