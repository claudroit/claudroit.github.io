<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waymark</title>
<meta name="description" content="A road trip journal. Add each place you reach and Waymark draws the route on a map.">
<meta name="theme-color" content="#F4F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Waymark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Overpass:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="trip" class="trip" aria-hidden="true">
  <div id="map" class="map"></div>

  <header class="topbar">
    <a class="round" id="btn-back" href="#/" aria-label="All trips"></a>
    <button class="titlepill" id="btn-title" aria-label="Rename trip"><span id="trip-name"></span></button>
    <button class="round" id="btn-menu" aria-label="Trip options"></button>
  </header>

  <div class="mapctl" id="mapctl">
    <button class="round" id="btn-fit" aria-label="Show the whole route"></button>
    <button class="round" id="btn-mode" aria-label="Follow roads" aria-pressed="false"></button>
    <button class="round" id="btn-locate" aria-label="Show where I am"></button>
    <button class="round" id="btn-replay" aria-label="Replay the trip"></button>
  </div>

  <section class="sheet" id="sheet" aria-label="Trip journal">
    <div class="sheet__head">
      <button class="sheet__grip" id="sheet-grip" aria-label="Expand or collapse the journal"><i></i></button>
      <div class="sheet__row">
        <div class="tally" id="tally"></div>
        <button class="sign sign--compact" id="btn-add"></button>
      </div>
    </div>
    <div class="sheet__body" id="sheet-body"></div>
  </section>

  <div class="pick" id="pick" hidden>
    <div class="pick__pin" aria-hidden="true"></div>
    <div class="pick__bar">
      <p>Move the map until the pin sits on the place.</p>
      <div class="pick__actions">
        <button class="plain" id="pick-cancel">Cancel</button>
        <button class="sign" id="pick-ok">Use this place</button>
      </div>
    </div>
  </div>

  <div class="replay" id="replay" hidden>
    <div class="replay__card">
      <span class="badge" id="replay-n"></span>
      <div class="replay__text"><strong id="replay-name"></strong><span id="replay-meta"></span></div>
      <button class="round round--flat" id="replay-stop" aria-label="Stop the replay"></button>
    </div>
  </div>
</main>

<main id="home" class="home">
  <div class="home__inner">
    <header class="home__head">
      <h1 class="wordmark">Waymark</h1>
      <p class="home__sub">Your road trips, stop by stop.</p>
    </header>
    <div id="home-body"></div>
  </div>
  <div class="home__foot" id="home-foot"></div>
</main>

<div id="layers"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<i class="probe" id="probe" aria-hidden="true"></i>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
