<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Verben</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/word-marks.css">
<script defer src="../shared/word-marks.js"></script>
<script defer src="verbs-data.js"></script>
<script defer src="typing.js"></script>
<script defer src="verbs.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<section id="verbs" class="screen" hidden>
  <header class="bar">
    <span></span>
    <span>100 Verben</span>
    <span></span>
  </header>
  <div class="top"><h1>100 Verben</h1><span class="sub verbs-sub">Präsens: je, tu, il, nous, vous, ils</span></div>
  <div id="verb-scope" class="segmented verb-track" role="group" aria-label="Verbauswahl">
    <button data-scope="all">Alle Verben</button>
    <button data-scope="accents">Verben mit Akzenten</button>
  </div>
  <p id="scope-note" class="quiet small"></p>
  <div id="verb-track" class="segmented verb-track">
    <button data-track="conj">Konjugieren</button>
    <button data-track="trans">Übersetzen</button>
  </div>
  <div id="verb-summary" class="verb-summary"></div>
  <ol class="steps-list">
    <li class="step">
      <div class="step-text"><strong>Erster Durchgang</strong><span id="step-first"></span></div>
      <button id="verb-first" class="step-go"></button>
    </li>
    <li class="step">
      <div class="step-text"><strong>Üben</strong><span id="step-practice"></span></div>
      <button id="verb-practice" class="step-go"></button>
    </li>
    <li class="step">
      <div class="step-text"><strong>Abschlusstest</strong><span id="step-test"></span><span id="verb-tests" class="step-note"></span></div>
      <button id="verb-test" class="step-go"></button>
    </li>
  </ol>
  <details class="verb-list"><summary id="verb-list-label">Alle Verben</summary><label class="mark-filter"><input id="marked-only" type="checkbox"> Nur markierte Verben</label><div id="verb-list"></div></details>
</section>

<section id="conj" class="screen" hidden>
  <header class="bar">
    <button id="conj-back" class="link">‹ Verben</button>
    <span id="conj-mode"></span>
    <span id="conj-progress" class="counts"></span>
  </header>
  <main class="card conj-card">
    <div id="conj-meta" class="meta"></div>
    <div id="conj-inf" class="side"></div>
    <div id="conj-de" class="conj-de"></div>
    <button id="mark-current" class="word-mark" type="button" aria-pressed="false">☆ Markieren</button>
    <form id="conj-form" class="conj-form" autocomplete="off"></form>
    <div class="accents" aria-label="Sonderzeichen"><button type="button" tabindex="-1">é</button><button type="button" tabindex="-1">è</button><button type="button" tabindex="-1">ê</button><button type="button" tabindex="-1">ë</button><button type="button" tabindex="-1">à</button><button type="button" tabindex="-1">â</button><button type="button" tabindex="-1">î</button><button type="button" tabindex="-1">ï</button><button type="button" tabindex="-1">ô</button><button type="button" tabindex="-1">û</button><button type="button" tabindex="-1">ù</button><button type="button" tabindex="-1">ü</button><button type="button" tabindex="-1">ç</button><button type="button" tabindex="-1">œ</button></div>
    <p id="conj-verdict" class="verdict conj-verdict" aria-live="polite"></p>
  </main>
  <footer class="actions">
    <button id="conj-go" class="primary">Prüfen</button>
  </footer>
</section>

<section id="conj-done" class="screen" hidden>
  <header class="bar">
    <button class="link" data-to-verbs>‹ Verben</button>
    <span></span><span></span>
  </header>
  <main class="center">
    <h2 id="conj-done-title"></h2>
    <p id="conj-done-text" class="quiet"></p>
    <div id="conj-done-list" class="chips"></div>
    <button id="conj-done-next" class="primary wide"></button>
  </main>
</section>
<p id="storage-status" class="storage-status" role="status">Fortschritt wird nur in diesem Browser gespeichert.</p>
</body>
</html>
