<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Französisch · Kapitel 3</title>
<link rel="stylesheet" href="style.css?v=6">
<script defer src="words-data.js?v=6"></script>
<script defer src="pairs-data.js?v=6"></script>
<script defer src="check.js?v=6"></script>
<script defer src="cards.js?v=6"></script>
<script defer src="trainer.js?v=6"></script>
<script defer src="app.js?v=6"></script>
</head>
<body>
<section id="words" class="screen" hidden>
  <header class="bar">
    <span></span>
    <span>Französisch</span>
    <span></span>
  </header>
  <div class="top"><h1>Kapitel 3 Vokabeln</h1><span id="mode-sub" class="sub">Deutsch → Französisch</span></div>
  <div id="mode" class="segmented verb-track" role="group" aria-label="Übung">
    <button data-mode="words">Vokabeln</button>
    <button data-mode="syn">Synonyme</button>
    <button data-mode="ant">Gegenteile</button>
    <button data-mode="cards">Karteikarten</button>
  </div>
  <div id="scope" class="segmented verb-track" role="group" aria-label="Kapitel">
    <button data-scope="all">Alle</button>
    <button data-scope="3.2">3.2</button>
    <button data-scope="3.3">3.3</button>
    <button data-scope="3.4">3.4</button>
    <button data-scope="3.5">3.5</button>
  </div>
  <p id="scope-note" class="quiet small"></p>
  <div id="cards-setup" class="cards-setup" hidden>
    <div class="setting"><span>Modus</span><div id="cards-mode" class="segmented" role="group" aria-label="Modus"><button data-v="flip">Normal</button><button data-v="check">Wusste ich?</button></div></div>
    <div class="setting"><span>Mischen</span><div id="cards-shuffle" class="segmented" role="group" aria-label="Mischen"><button data-v="false">Aus</button><button data-v="true">An</button></div></div>
    <div class="setting"><span>Vorderseite</span><div id="cards-front" class="segmented" role="group" aria-label="Vorderseite"><button data-v="de">Deutsch</button><button data-v="fr">Französisch</button></div></div>
    <p id="cards-mode-note" class="quiet small"></p>
    <button id="cards-start" class="primary wide"></button>
  </div>
  <div id="summary" class="verb-summary"></div>
  <ol class="steps-list">
    <li class="step">
      <div class="step-text"><strong>Erster Durchgang</strong><span id="step-first"></span></div>
      <div class="step-buttons">
        <button id="go-first" class="step-go"></button>
        <button id="skip-first" class="step-skip link small">Überspringen</button>
      </div>
    </li>
    <li class="step">
      <div class="step-text"><strong>Üben</strong><span id="step-practice"></span></div>
      <button id="go-practice" class="step-go"></button>
    </li>
    <li class="step">
      <div class="step-text"><strong>Abschlusstest</strong><span id="step-test"></span><span id="tests" class="step-note"></span></div>
      <button id="go-test" class="step-go"></button>
    </li>
  </ol>
  <details class="verb-list"><summary id="list-label">Alle Wörter</summary>
    <label for="list-search" class="visually-hidden">Wörter suchen</label>
    <input id="list-search" class="conj-input list-search" type="search" placeholder="Französisch oder Deutsch suchen …" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="word-list"></div>
  </details>
</section>

<section id="ask" class="screen" hidden>
  <header class="bar">
    <button id="ask-back" class="link">‹ Wörter</button>
    <span id="ask-mode"></span>
    <span id="ask-progress" class="counts"></span>
  </header>
  <div class="ask-track" aria-hidden="true"><div id="ask-bar" class="ask-bar"></div></div>
  <main class="card conj-card">
    <div id="ask-meta" class="meta"></div>
    <div id="ask-de" class="side" lang="de"></div>
    <p id="ask-hint" class="quiet small ask-hint" lang="de" hidden></p>
    <form id="ask-form" class="en-form" autocomplete="off">
      <label for="ask-input" class="visually-hidden">Auf Französisch</label>
      <input id="ask-input" class="conj-input en-input" lang="fr" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="Auf Französisch …">
    </form>
    <div id="accents" class="accents" aria-label="Sonderzeichen"><button type="button">é</button><button type="button">è</button><button type="button">ê</button><button type="button">à</button><button type="button">â</button><button type="button">ç</button><button type="button">î</button><button type="button">ï</button><button type="button">ô</button><button type="button">ù</button><button type="button">û</button><button type="button">ë</button><button type="button">œ</button></div>
    <p id="ask-verdict" class="verdict conj-verdict" aria-live="polite"></p>
    <div id="ask-result" class="en-result" hidden>
      <div id="ask-diff" class="diff" hidden>
        <span class="who">Du</span><span id="diff-typed" class="line" lang="fr"></span>
        <span class="who">Buch</span><span id="diff-book" class="line" lang="fr"></span>
      </div>
      <p id="ask-answer" class="en-answer" lang="fr"></p>
      <p id="ask-other" class="en-other" hidden></p>
    </div>
  </main>
  <footer class="actions">
    <button id="ask-override" class="link small override" type="button" hidden>Ich hatte es richtig</button>
    <button id="ask-go" class="primary">Prüfen</button>
  </footer>
</section>

<section id="cards" class="screen" hidden>
  <header class="bar">
    <button id="cards-back" class="link">‹ Wörter</button>
    <span id="cards-title"></span>
    <span id="cards-progress" class="counts"></span>
  </header>
  <div class="ask-track" aria-hidden="true"><div id="cards-bar" class="ask-bar"></div></div>
  <main class="card">
    <button id="card" class="flashcard" type="button">
      <span id="card-meta" class="meta"></span>
      <span id="card-text" class="side"></span>
      <span id="card-hint" class="quiet small"></span>
    </button>
  </main>
  <footer class="actions">
    <div id="cards-flip-nav" class="cards-row"><button id="cards-prev" type="button">‹ Zurück</button><button id="cards-next" type="button" class="primary">Weiter ›</button></div>
    <button id="cards-turn" class="primary cards-full" type="button">Umdrehen</button>
    <div id="cards-grade" class="cards-row"><button id="cards-no" type="button" class="cards-no">✗ Wusste ich nicht</button><button id="cards-yes" type="button" class="cards-yes">✓ Wusste ich</button></div>
  </footer>
</section>

<section id="cards-done" class="screen" hidden>
  <header class="bar">
    <button id="cards-done-back" class="link">‹ Wörter</button>
    <span></span><span></span>
  </header>
  <main class="center">
    <h2 id="cards-done-title"></h2>
    <p id="cards-done-text" class="quiet"></p>
    <div id="cards-done-list" class="chips"></div>
    <button id="cards-again" class="primary wide"></button>
    <button id="cards-restart" class="wide cards-restart"></button>
  </main>
</section>

<section id="done" class="screen" hidden>
  <header class="bar">
    <button class="link" data-to-words>‹ Wörter</button>
    <span></span><span></span>
  </header>
  <main class="center">
    <h2 id="done-title"></h2>
    <p id="done-text" class="quiet"></p>
    <div id="done-list" class="chips"></div>
    <button id="done-next" class="primary wide"></button>
  </main>
</section>
<p id="storage-status" class="storage-status" role="status">Fortschritt wird nur in diesem Browser gespeichert.</p>
</body>
</html>
