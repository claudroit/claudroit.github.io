<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tally</title>
  <meta name="description" content="Tap when you did it.">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tally">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="top">
      <h1>Tally</h1>
      <span id="today" class="sub"></span>
    </header>
    <section id="habits" class="habits" aria-live="polite"></section>
    <footer class="foot">
      <span id="sync-status">Not synced yet</span>
      <button id="reconnect" class="link" type="button">Reconnect</button>
    </footer>
  </main>
  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-undo" type="button">Undo</button>
  </div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
